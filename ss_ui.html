<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StoryStudio</title>
<link rel="icon" href="/icon.ico">
<style>
:root{
  --bg:#0e1015; --bg2:#12151c; --card:#171b23; --card2:#1d222c; --line:#272d39;
  --text:#eef0f4; --soft:#9aa3b2; --faint:#6b7383;
  --accent:#ffb347; --accent2:#ff7a59; --good:#4cd6a0; --warn:#ffcc66; --bad:#ff6b6b;
  --grad:linear-gradient(135deg,#ffb347 0%,#ff7a59 100%);
  --radius:16px; --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:15px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--text)}
a{color:var(--accent)}
.app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:14px;padding:18px 28px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#141821,#10131a)}
.logo{width:36px;height:36px;border-radius:10px;background:var(--grad);display:grid;place-items:center;box-shadow:0 6px 18px rgba(255,122,89,.35)}
.logo svg{width:22px;height:22px}
.brand{font:600 19px "Segoe UI Variable Display","Segoe UI",sans-serif;letter-spacing:.2px}
.brand small{display:block;font:400 12.5px "Segoe UI",sans-serif;color:var(--soft);letter-spacing:0}
header .grow{flex:1}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--soft)}
.iconbtn:hover{background:var(--card2);color:var(--text)}
main{flex:1;overflow:auto;padding:28px}
.wrap{max-width:1120px;margin:0 auto}
h1{font:600 28px "Segoe UI Variable Display","Segoe UI",sans-serif;margin:0 0 6px}
h2{font:600 18px "Segoe UI Variable Display","Segoe UI",sans-serif;margin:0 0 12px}
.sub{color:var(--soft);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.row{display:flex;gap:16px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:11px;background:var(--card2);
  border:1px solid var(--line);font-weight:500;transition:.15s}
.btn:hover{border-color:#3a4252;background:#232937}
.btn.primary{background:var(--grad);border:0;color:#1b1206;font-weight:600;box-shadow:0 8px 22px rgba(255,122,89,.28)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.big{padding:14px 22px;font-size:16px;border-radius:13px}
.btn.ghost{background:none;border-color:transparent;color:var(--soft)}
.btn.ghost:hover{color:var(--text);background:var(--card2)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--card2);
  border:1px solid var(--line);color:var(--soft);font-size:13px}
.chip.good{color:var(--good);border-color:rgba(76,214,160,.3);background:rgba(76,214,160,.08)}
.chip.warn{color:var(--warn);border-color:rgba(255,204,102,.3);background:rgba(255,204,102,.08)}
.hidden{display:none!important}
/* home */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:22px}
.drop{border:1.5px dashed #3a4252;border-radius:20px;padding:44px;text-align:center;background:
  radial-gradient(600px 220px at 50% 0%,rgba(255,179,71,.08),transparent),var(--card)}
.drop svg{width:54px;height:54px;color:var(--accent);margin-bottom:10px}
.recent{display:flex;flex-direction:column;gap:8px}
.recent button{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line)}
.recent button:hover{border-color:#3a4252}
.recent .ic{width:34px;height:34px;border-radius:9px;background:#2a2142;display:grid;place-items:center;color:#c9a7ff;font-weight:700;font-size:12px}
.recent small{color:var(--faint)}
.project{display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:stretch}
.thumb{border-radius:14px;background:#0b0d12 center/cover no-repeat;min-height:170px;border:1px solid var(--line);position:relative;overflow:hidden}
.thumb .len{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.65);padding:2px 8px;border-radius:7px;font-size:13px}
.pname{font:600 22px "Segoe UI Variable Display","Segoe UI",sans-serif;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.saved{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:11px;background:rgba(76,214,160,.07);
  border:1px solid rgba(76,214,160,.22);color:#bdf0db;font-size:14px}
.saved svg{flex:none;width:18px;height:18px;color:var(--good);margin-top:2px}
.field{display:flex;align-items:center;gap:10px;margin-top:12px;color:var(--soft);font-size:14px}
.field b{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:520px}
select{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:6px 10px}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:26px}
.task{position:relative;text-align:left;padding:20px;border-radius:16px;background:var(--card);border:1px solid var(--line);transition:.18s;min-height:150px}
.task:hover:not(.soon){transform:translateY(-2px);border-color:#46506a;box-shadow:var(--shadow)}
.task .ti{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;margin-bottom:14px}
.task .ti svg{width:24px;height:24px}
.task b{display:block;font-size:16.5px;margin-bottom:4px}
.task span{color:var(--soft);font-size:14px}
.task.soon{opacity:.55;cursor:default}
.badge{position:absolute;top:14px;right:14px;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--soft)}
/* setup panel */
.panel{margin-top:20px}
.opt{display:grid;grid-template-columns:200px 1fr;gap:18px;padding:14px 0;border-top:1px solid var(--line);align-items:center}
.opt:first-of-type{border-top:0}
.opt label.t{font-weight:500}
.opt .hint{color:var(--faint);font-size:13px;margin-top:4px}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{padding:8px 14px;border-radius:9px;color:var(--soft)}
.seg button.on{background:var(--card2);color:var(--text);box-shadow:inset 0 0 0 1px #3a4252}
.switch{position:relative;width:46px;height:26px;flex:none;border-radius:999px;background:#2b3240;transition:.2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#cfd5df;transition:.2s}
.switch.on{background:var(--grad)}
.switch.on::after{left:23px;background:#fff}
.swrow{display:flex;align-items:center;gap:12px}
.keyin{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:280px}
.est{display:flex;align-items:center;gap:10px;color:var(--soft)}
.est b{color:var(--text)}
.footerbar{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:16px}
/* working */
.working{max-width:720px;margin:6vh auto 0}
.bar{height:12px;border-radius:999px;background:#232937;overflow:hidden;margin:22px 0 10px}
.bar i{display:block;height:100%;width:0;background:var(--grad);border-radius:999px;transition:width .6s ease}
.left{font:600 20px "Segoe UI Variable Display","Segoe UI",sans-serif}
.steps{list-style:none;padding:0;margin:22px 0 0}
.steps li{display:flex;gap:12px;align-items:center;padding:7px 0;color:var(--soft)}
.steps li.now{color:var(--text)}
.dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;background:#232937}
.steps li.ok .dot{background:rgba(76,214,160,.15);color:var(--good)}
.steps li.now .dot{border:2px solid var(--accent);border-top-color:transparent;animation:spin 1s linear infinite;background:none}
@keyframes spin{to{transform:rotate(360deg)}}
/* review */
.rhead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:16px}
.banner{padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--soft);font-size:14px;margin-bottom:14px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.filters .chip{cursor:pointer}
.filters .chip.on{color:#1b1206;background:var(--grad);border-color:transparent;font-weight:600}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:52px 70px 1fr auto auto;gap:14px;align-items:center;padding:12px 14px;border-radius:14px;
  background:var(--card);border:1px solid var(--line);transition:.15s}
.item:hover{border-color:#353d4d}
.item.off{opacity:.5}
.item .tm{font-variant-numeric:tabular-nums;color:var(--soft);font-size:14px}
.item .w b{display:block;font-weight:500}
.item .w small{color:var(--faint);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:560px}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--soft);white-space:nowrap}
.pill.new{color:var(--accent);border-color:rgba(255,179,71,.35)}
.pill.warn{color:var(--warn);border-color:rgba(255,204,102,.35)}
.acts{display:flex;gap:4px}
.acts .iconbtn{width:34px;height:34px}
.play{width:38px;height:38px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center}
.play:hover{border-color:var(--accent);color:var(--accent)}
.play svg{width:16px;height:16px}
.menu{position:fixed;z-index:50;min-width:230px;background:#1c212b;border:1px solid #333b4a;border-radius:12px;padding:6px;box-shadow:var(--shadow)}
.menu button{display:flex;width:100%;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;text-align:left}
.menu button:hover{background:#262d3a}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu svg{width:16px;height:16px;color:var(--soft)}
/* done */
.done{display:grid;grid-template-columns:1.4fr 1fr;gap:22px}
video{width:100%;border-radius:14px;background:#000;border:1px solid var(--line)}
.ok-ring{width:56px;height:56px;border-radius:50%;background:rgba(76,214,160,.12);display:grid;place-items:center;color:var(--good);margin-bottom:12px}
.ok-ring svg{width:30px;height:30px}
.notes{margin:14px 0 0;padding-left:18px;color:var(--soft);font-size:14px}
.notes li{margin:4px 0}
/* feedback */
.fb{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}
.fb > div:first-child{position:sticky;top:0}
.sev{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.note{display:grid;grid-template-columns:10px 1fr auto;gap:14px;align-items:start;padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.note .sev{margin-top:7px}
.note.off{opacity:.5}
.note .nh{display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.note .nh b{font-weight:600}
.note .how{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--bg2);color:var(--soft);font-size:14px}
.tmb{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-variant-numeric:tabular-nums;font-size:13px;color:var(--soft)}
.tmb:hover{border-color:var(--accent);color:var(--accent)}
.good-t{color:var(--good)} .fix-t{color:var(--warn)}
@media (max-width:900px){.fb{grid-template-columns:1fr}.fb > div:first-child{position:static}}
/* script builder */
.sbsteps{display:flex;flex-direction:column;gap:14px}
.sbstep{display:flex;gap:18px;align-items:flex-start}
.sbn{width:34px;height:34px;flex:none;border-radius:50%;background:var(--grad);color:#1b1206;font-weight:700;display:grid;place-items:center}
.sbin{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;resize:vertical}
.kindbtn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:18px 22px;border-radius:14px;background:var(--bg2);border:1.5px solid var(--line);min-width:220px;text-align:left}
.kindbtn svg{width:26px;height:26px;color:var(--accent);margin-bottom:6px}
.kindbtn span{color:var(--soft);font-size:14px}
.kindbtn.on{border-color:var(--accent);background:rgba(255,179,71,.08)}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:12px}
.idea{text-align:left;padding:14px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.idea:hover{border-color:var(--accent)}
.idea b{display:block;margin-bottom:4px}.idea span{color:var(--soft);font-size:14px}
.talkq{padding:14px 0;border-top:1px solid var(--line)}.talkq:first-child{border-top:0;padding-top:0}
.talkq h3{margin:0 0 8px;font-size:16px}
.talkq .chips{margin:0 0 8px}.talkq .chip{cursor:pointer;font-size:14px;padding:6px 12px}
.talkq .chip.on{color:#1b1206;background:var(--grad);border-color:transparent;font-weight:600}
.talkbusy{display:flex;align-items:center;gap:12px;color:var(--soft)}
.stylegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;max-height:520px;overflow:auto;padding-right:4px}
.stylecard{position:relative;text-align:left;padding:12px 14px;border-radius:12px;background:var(--bg2);border:1.5px solid var(--line)}
.stylecard:hover{border-color:#46506a}
.stylecard.on{border-color:var(--accent);background:rgba(255,179,71,.08)}
.stylecard b{display:block;margin-bottom:4px;padding-right:16px}.stylecard span{color:var(--faint);font-size:12.5px}
.stylecard .del{position:absolute;top:6px;right:10px;font-style:normal;color:var(--faint);font-size:18px}
.stylecard .del:hover{color:var(--bad)}
.stylecard img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;margin-bottom:8px;background:#0b0d12}
.stylechosen{margin-top:14px}
.stylepics{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.stylepics figure{margin:0}
.stylepics img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block}
.stylepics figcaption{color:var(--faint);font-size:12.5px;margin-top:4px}
.toplist{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-top:16px}
.charlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.scenehead{margin:26px 0 10px;padding-left:12px;border-left:3px solid var(--accent)}
.shot{margin-bottom:12px}
.shot.extra{border-style:dashed}
.shot .words{margin:12px 0 4px;color:#ffe2b0}
.shot .purpose{margin:6px 0 2px;color:var(--soft);font-size:14px}
.pbox{margin-top:12px}
.ptitle{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin-bottom:6px}
.ptitle .sub{margin:0;font-weight:400;font-size:13px}
.ptext{white-space:pre-wrap;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;color:#d9dde5;max-height:220px;overflow:auto}
.btn.small{padding:5px 12px;font-size:13px;border-radius:9px}
.pastlist{display:flex;flex-direction:column;gap:8px}
.pastrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line)}
.pastrow b{display:block;font-weight:500}.pastrow small{color:var(--faint)}
.pbox.busy .ptext{opacity:.45}
.pbox.fresh .ptext{border-color:var(--good);box-shadow:0 0 0 2px rgba(76,214,160,.25);transition:box-shadow .3s}
.pmsg{font-size:13.5px;margin-top:6px;color:var(--soft);display:flex;align-items:center;gap:8px}
.pmsg:empty{display:none}
.pmsg .ok{color:var(--good)} .pmsg .err{color:var(--bad)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);border-top-color:transparent;animation:spin 1s linear infinite;display:inline-block}
.updbar{display:flex;align-items:center;gap:12px;padding:10px 28px;background:rgba(255,179,71,.1);border-bottom:1px solid rgba(255,179,71,.35);color:#ffe2b0;font-size:14px}
.updbar > span{flex:1;display:flex;align-items:center;gap:8px}
.task.pick{cursor:pointer}
.task.picked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.pickmark{position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:50%;border:2px solid #3a4252;display:grid;place-items:center;font-weight:700;color:#1b1206}
.task.picked .pickmark{background:var(--grad);border-color:transparent}
.planstep{display:flex;gap:16px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.planstep:first-of-type{border-top:0}
.chainbar{display:flex;align-items:center;gap:12px;padding:10px 28px;background:rgba(124,196,255,.08);border-bottom:1px solid rgba(124,196,255,.3);font-size:14px;flex-wrap:wrap}
.csteps{display:flex;align-items:center;gap:6px;flex:1;flex-wrap:wrap}
.cstep{color:var(--faint)} .cstep.now{color:var(--text);font-weight:600} .cstep.done{color:var(--good)}
.carrow{color:var(--faint)} .cnext{color:#bfe0ff}
/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(4,6,10,.62);backdrop-filter:blur(3px);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:24px 12px;z-index:60}
.modal{margin:auto 0;width:min(720px,92vw);background:var(--card);border:1px solid #333b4a;border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.modal textarea,.modal input[type=text]{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0 16px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#232937;border:1px solid #3a4252;padding:12px 18px;border-radius:12px;z-index:70;box-shadow:var(--shadow);max-width:80vw}
.toast.err{border-color:rgba(255,107,107,.5)}
::-webkit-scrollbar{width:12px}::-webkit-scrollbar-thumb{background:#2a303c;border-radius:10px;border:3px solid var(--bg)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#1b1206" stroke-width="2.2" stroke-linecap="round"><path d="M4 9v6M8 6v12M12 3v18M16 7v10M20 10v4"/></svg></div>
    <div class="brand">StoryStudio<small>Your AI editing helper for stories, movies and music videos</small></div>
    <div class="grow"></div>
    <button class="iconbtn" title="Home" onclick="goHome()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button>
    <button class="iconbtn" title="Settings" onclick="openSettings()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <div id="updbar" class="updbar hidden"></div>
  <div id="chainbar" class="chainbar hidden"></div>
  <main><div class="wrap" id="view"></div></main>
</div>
<div id="layer"></div>

<script>
const TOKEN = "__TOKEN__";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let H = {};            // last hello
let P = null;          // project
let R = null;          // review
let filter = "";
let opts = {};

let DEAD = false;
function showStopped() {
  if (DEAD) return; DEAD = true;
  modal(`<h2>StoryStudio stopped running</h2><p class="sub">This window lost its connection to StoryStudio, so its buttons can't do anything. Close this window and open StoryStudio again from the Desktop or Start Menu. Your finished work is saved.</p>
    <div class="footerbar"><span></span><button class="btn primary" onclick="window.close()">Close this window</button></div>`);
}
async function api(name, data = {}) {
  let r;
  try { r = await fetch("/api/" + name, {method:"POST", headers:{"Content-Type":"application/json","X-Token":TOKEN}, body:JSON.stringify(data)}); }
  catch (e) { showStopped(); throw new Error("StoryStudio isn't running."); }
  const j = await r.json();
  if (j.error) { toast(j.error, true); throw new Error(j.error); }
  return j;
}
function toast(msg, err) {
  const t = document.createElement("div"); t.className = "toast" + (err ? " err" : ""); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), err ? 7000 : 3500);
}
function modal(html) { $("#layer").innerHTML = `<div class="scrim" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`; }
function closeModal() { $("#layer").innerHTML = ""; }
// something didn't finish: the message stays until it's read, with a way to send the details
function showProblem(msg) {
  modal(`<h2>That didn't finish</h2><div style="margin:10px 0 14px">${esc(msg)}</div>
    <div class="sub" style="margin:0">If it keeps happening, save a problem report: one file with the details of what happened on this computer. Send that file to whoever helps you with StoryStudio.</div>
    <div class="footerbar"><button class="btn" id="prbtn" onclick="problemReport()">Save a problem report</button><button class="btn primary" onclick="closeModal()">OK</button></div>`);
}
async function problemReport() {
  const b = $("#prbtn"); if (b) { b.disabled = true; b.textContent = "Saving…"; }
  try { const j = await api("problem_report"); toast(`Saved to ${j.where}: ${j.name}`); if (b) b.textContent = "Saved to " + j.where; }
  catch (e) { if (b) { b.disabled = false; b.textContent = "Save a problem report"; } }
}
function reportError(msg) { fetch("/api/client_error", {method:"POST", headers:{"Content-Type":"application/json","X-Token":TOKEN}, body:JSON.stringify({msg:String(msg).slice(0, 3000)})}).catch(()=>{}); }
window.addEventListener("error", e => reportError("window error: " + e.message + " at " + (e.filename || "") + ":" + (e.lineno || "")));
window.addEventListener("unhandledrejection", e => reportError("unhandled: " + (e.reason && (e.reason.stack || e.reason.message) || e.reason)));
function ping() { return fetch("/api/ping", {method:"POST", headers:{"X-Token":TOKEN}, body:"{}"}).catch(()=>{}); }
setInterval(ping, 5000);
// coming back to the window: say hello straight away (Edge slows background windows down)
document.addEventListener("visibilitychange", () => { if (!document.hidden) ping(); });
window.addEventListener("focus", ping);

async function goHome() {
  if (polling) {                 // a job is running: show its progress rather than nothing
    if (!$("#jt")) { const j = (await api("job")).job; if (j) { clearInterval(polling); polling = null; watchJob(j); } }
    toast("StoryStudio is still working on this. You'll see the result here when it's done.");
    return;
  }
  // already on this project's home screen: Home goes back to the start page
  const onProjectHome = !!$("#view .project") && !$("#setup .panel");
  H = await api("hello"); P = H.project; opts = Object.assign({best_of:3, busy:"normal"}, H.settings);
  if (H.job) return watchJob(H.job);
  if (onProjectHome) P = null;
  renderHome();
  $("main").scrollTop = 0;
}

}

// ---------------------------------------------------------------- several at once
const STEPS = {sounds:"Add sound effects", fix:"Fix the audio", karaoke:"Karaoke lyrics", feedback:"Edit feedback"};
const ORDER = ["sounds", "fix", "karaoke", "feedback"];
let MULTI = false, PICK = [], CHAIN = null;
function toggleMulti() { MULTI = !MULTI; PICK = []; renderHome(); }
function pickTask(id, ic, bg, col, title, text, onclick) {
  if (!MULTI) return task(ic, bg, col, title, text, onclick);
  const n = PICK.indexOf(id);
  return `<button class="task pick ${n >= 0 ? "picked" : ""}" onclick="togglePick('${id}')"><div class="ti" style="background:${bg};color:${col}">${ICON[ic]}</div><b>${title}</b><span>${text}</span><span class="pickmark">${n >= 0 ? n + 1 : ""}</span></button>`;
}
function togglePick(id) {
  PICK = PICK.includes(id) ? PICK.filter(x => x !== id) : PICK.concat(id);
  PICK.sort((a, b) => ORDER.indexOf(a) - ORDER.indexOf(b));
  const y = $("main").scrollTop; renderHome(); $("main").scrollTop = y;
  if (!PICK.length) $("#setup").innerHTML = "";
}
function renderPlan() {
  const keep = $("#plan_lyrics") ? $("#plan_lyrics").value : (H.lyrics || "");
  H.lyrics = keep;
  const fbSeg = (key, items) => `<div class="seg">${items.map(([v,t]) => `<button class="${fbOpts[key]===v?"on":""}" onclick="fbOpts.${key}=${esc(JSON.stringify(v))};renderPlan()">${t}</button>`).join("")}</div>`;
  const parts = PICK.map((id, i) => {
    let body = "";
    if (id === "sounds") body = `<div class="opt"><div><label class="t">How many sounds</label></div>${seg("busy",[["light","A few"],["normal","Normal"],["lots","Lots, like a big movie"]])}</div>
      <div class="opt"><div><label class="t">Quality</label></div>${seg("best_of",[[3,"Best"],[1,"Quick"]])}</div>
      <div class="opt"><div><label class="t">Background music</label></div><div class="swrow">${sw("add_music")}<span class="sub" style="margin:0">${opts.add_music?"On":"Off"}</span></div></div>
      <div class="sub" style="margin:6px 0 0">You'll check the sounds before they go in; after you press “Put them in my movie”, StoryStudio carries on by itself.</div>`;
    if (id === "fix") body = `<div class="sub" style="margin:0">Cleans and balances everything${PICK.includes("sounds") ? ", including the new sound effects" : ""}.</div>`;
    if (id === "karaoke") body = `<textarea id="plan_lyrics" rows="8" class="sbin" placeholder="Paste the lyrics here…" oninput="H.lyrics=this.value">${esc(keep)}</textarea>
      <div class="row" style="margin-top:8px"><button class="btn" onclick="planLoadLyrics()">${ICON.folder} Load from a file…</button></div>`;
    if (id === "feedback") body = `<div class="opt"><div><label class="t">This is a</label></div>${fbSeg("kind",[["auto","Let StoryStudio tell"],["story","Story or movie"],["music","Music video"]])}</div>`;
    return `<div class="planstep"><div class="sbn">${i + 1}</div><div style="flex:1;min-width:0"><b>${STEPS[id]}</b>${body ? `<div style="margin-top:8px">${body}</div>` : ""}</div></div>`;
  }).join("");
  $("#setup").innerHTML = `<div class="card panel"><h2>Your plan</h2>${parts}
    <div class="footerbar"><span class="sub" style="margin:0">Each step works on the copy the step before made. Your project isn't changed.</span>
    <button class="btn primary big" onclick="startChain()">Start ${PICK.length} step${PICK.length > 1 ? "s" : ""} ${arrow()}</button></div></div>`;
}
async function planLoadLyrics() { const j = await api("pick_lyrics"); if (j.text) { H.lyrics = j.text; $("#plan_lyrics").value = j.text; } }
async function startChain() {
  if ($("#plan_lyrics")) H.lyrics = $("#plan_lyrics").value;
  if (PICK.includes("karaoke") && !(H.lyrics || "").trim()) return toast("Paste the song's lyrics for the karaoke step first.", true);
  CHAIN = {steps: PICK.slice(), i: 0, lyrics: H.lyrics, fb: Object.assign({}, fbOpts), opts: Object.assign({}, opts)};
  runStep();
}
function chainBar(html) { const b = $("#chainbar"); if (!html) { b.classList.add("hidden"); return; } b.innerHTML = html; b.classList.remove("hidden"); }
function chainStatus(extra) {
  if (!CHAIN) return chainBar("");
  const steps = CHAIN.steps.map((id, i) => `<span class="cstep ${i < CHAIN.i ? "done" : i === CHAIN.i ? "now" : ""}">${i < CHAIN.i ? "✓ " : ""}${STEPS[id]}</span>`).join('<span class="carrow">›</span>');
  chainBar(`<span class="csteps">${steps}</span>${extra || ""}<button class="btn small ghost" onclick="stopChain()">Stop the plan</button>`);
}
function stopChain() { CHAIN = null; chainBar(""); toast("The plan is stopped. Everything finished so far is saved."); }
async function runStep() {
  const id = CHAIN.steps[CHAIN.i];
  chainStatus();
  let j;
  try {
    if (id === "sounds") j = await api("start_sounds", CHAIN.opts);
    if (id === "fix") j = await api("start_fix_audio", CHAIN.opts);
    if (id === "karaoke") j = await api("start_karaoke", {lyrics: CHAIN.lyrics});
    if (id === "feedback") j = await api("start_feedback", CHAIN.fb);
  } catch (e) { stopChain(); return; }
  watchJob(j.job);
}
// after a step's result is on screen: go on to the next step, on the copy this one made
function chainNext(o) {
  if (!CHAIN) return;
  if (!o.project) { toast("The plan stopped: " + (o.project_error || "this step didn't make a project copy."), true); CHAIN = null; chainBar(""); return; }
  CHAIN.i += 1;
  if (CHAIN.i >= CHAIN.steps.length) { CHAIN = null; chainBar('<span>✓ Your plan is finished. Everything is in the copy shown here.</span>'); return; }
  let left = 5;
  const tick = async () => {
    if (!CHAIN) return;
    if (left > 0) { chainStatus(`<span class="cnext">Next: ${STEPS[CHAIN.steps[CHAIN.i]]} in ${left}…</span>`); left -= 1; setTimeout(tick, 1000); return; }
    try { const r = await api("open_project", {path: o.project}); P = r.project; } catch (e) { stopChain(); return; }
    runStep();
  };
  tick();
}
function task(ic, bg, col, title, text, onclick, soon) {
  return `<button class="task ${soon?"soon":""}" ${soon?"":`onclick="${onclick}"`}><div class="ti" style="background:${bg};color:${col}">${ICON[ic]}</div><b>${title}</b><span>${text}</span>${soon?'<span class="badge">Coming next</span>':""}</button>`;
}
async function homeOpenList(path, b) {
  b.disabled = true; b.textContent = "Opening…";
  try { if (!SBD) { SBD = await api("sb_styles"); } await sbOpen(path); }
  catch (e) { b.disabled = false; b.textContent = "Open"; }
}
let picking = false;                  // one file window at a time (a double-click opened two)
async function pickProject() { if (picking) return; picking = true; try { const j = await api("pick_project"); if (j.project) { P = j.project; renderHome(); } } finally { picking = false; } }
async function openProject(path) { toast("Opening and saving a copy…"); const j = await api("open_project", {path}); P = j.project; renderHome(); }
async function switchSeq(uid) { const j = await api("open_project", {path:P.file, seq_uid:uid}); P = j.project; renderHome(); }
async function pickStory() { if (picking) return; picking = true; try { const j = await api("pick_story"); P = j.project; renderHome(); } finally { picking = false; } }
async function openPrevious() { const j = await api("open_previous"); R = j.review; filter = ""; renderReview(); }

function setupFix() {
  $("#setup").innerHTML = `

function watchJob(first) {
  let shown = false;
  const draw = j => {
    if (!shown || !$("#jt")) {
      $("#view").innerHTML = `<div class="working card"><h1 id="jt"></h1><div class="sub" id="jm"></div>
        <div class="bar"><i id="jb"></i></div><div class="row" style="justify-content:space-between"><span class="left" id="jl"></span><span class="sub" id="jp" style="margin:0"></span></div>
        <ul class="steps" id="js"></ul>
        <div class="footerbar"><span class="sub" style="margin:0">You can keep using your computer.</span><button class="btn" onclick="api('stop');toast('Stopping after this step…')">Stop</button></div></div>`;
      shown = true;
    }
    $("#jt").textContent = j.title; $("#jm").textContent = j.msg;
    $("#jb").style.width = (j.frac * 100).toFixed(1) + "%";
    $("#jl").textContent = j.elapsed < 8 ? "Getting started…" : j.left;
    $("#jp").textContent = Math.round(j.frac * 100) + "%";
    const st = j.steps || [];
    $("#js").innerHTML = st.map((s, i) => `<li class="${i < st.length - 1 ? "ok" : "now"}"><span class="dot">${i < st.length - 1 ? ICON.check.replace('<svg','<svg width="12" height="12"') : ""}</span>${esc(s)}</li>`).join("");
  };
  if (first) draw(first);
  clearInterval(polling);
  polling = setInterval(async () => {
    let j; try { j = (await api("job")).job; } catch (e) { return; }
    if (!j) return;
    draw(j);
    if (j.done) {
      clearInterval(polling); polling = null;
      if (j.failed) { if (j.error === "Stopped.") toast(j.error, true); else setTimeout(() => showProblem(j.error), 50); if (CHAIN) { CHAIN = null; chainBar("<span>The plan stopped because a step didn't finish. Everything done before it is saved.</span>"); } goHome(); return; }
      if (j.then === "review") { R = (await api("review")).review; filter = ""; renderReview(); }
      else if (j.then === "done") renderDone();
      else if (j.then === "home") { const tools = j.title.startsWith("Getting"); await goHome(); if (!tools) openSettings(); else toast("StoryStudio is ready"); }
      else if (j.then === "script") { SBR = (await api("sb_result")).result; renderScript(); $("main").scrollTop = 0; }
      else if (j.then === "feedback") { F = (await api("feedback")).feedback; fbFilter = ""; renderFeedback(); }
    }
  }, 700);
}

      <button class="iconbtn" title="More" onclick="openMenu(event,'${c.id}')">${ICON.more}</button></div>
  </div>`;
}
function setFilter(k) { filter = k; renderReview(); }
async function setAll(v) { const j = await api("all", {keep:v, kind: filter ? R.cues.find(c=>c.kind===filter).kind_id : ""}); R = j.review; renderReview(); }
function cueById(id) { return R.cues.find(c => c.id === id); }
async function toggle(id) { const c = cueById(id); const j = await api("toggle", {id, keep:!c.keep}); Object.assign(c, j.cue); renderReview(); }
let audio = null, playingBtn = null;
function play(id, btn) {
  const c = cueById(id);
  if (audio && playingBtn === btn) { audio.pause(); return; }
  if (audio) audio.pause();
  audio = new Audio(c.audio + "&v=" + Date.now()); playingBtn = btn; btn.innerHTML = ICON.pause;
  const mine = audio;
  audio.onpause = audio.onended = () => { btn.innerHTML = ICON.play; if (audio === mine) { audio = null; playingBtn = null; } };
  audio.play();
}
function openMenu(ev, id) {
  ev.stopPropagation(); closeMenu();
  const c = cueById(id), m = document.createElement("div"); m.className = "menu"; m.id = "menu";
  const items = [];
  if (c.made) items.push(["Watch it with the movie", `watch('${id}')`], ["1 frame earlier", `nudge('${id}',-${c.frame || 0.0417})`], ["1 frame later", `nudge('${id}',${c.frame || 0.0417})`], ["A bit earlier (0.1 s)", `nudge('${id}',-0.1)`], ["A bit later (0.1 s)", `nudge('${id}',0.1)`], ["Quieter", `louder('${id}',-3)`], ["Louder", `louder('${id}',3)`], ["-"]);
  items.push(["Try a different one", `remake('${id}')`], ["Change it in my words…", `changeIt('${id}')`], ["-"], [c.suno ? "Copy Suno wording" : "Copy Adobe wording", `copyWording('${id}')`]);
  m.innerHTML = items.map(([t, f]) => t === "-" ? "<hr>" : `<button onclick="closeMenu();${f}">${t}</button>`).join("");
  document.body.appendChild(m);
  const r = ev.currentTarget.getBoundingClientRect();
  m.style.top = Math.min(r.bottom + 6, innerHeight - m.offsetHeight - 10) + "px"; m.style.left = Math.max(10, r.right - m.offsetWidth) + "px";
  setTimeout(() => document.addEventListener("click", closeMenu, {once:true}), 0);
}
function closeMenu() { const m = $("#menu"); if (m) m.remove(); }
async function watch(id) { toast("Making a little preview…"); const j = await api("watch", {id}); modal(`<h2>${esc(cueById(id).what)}</h2><video src="${j.video}" controls autoplay></video><div class="footerbar"><span></span><button class="btn" onclick="closeModal()">Close</button></div>`); }
async function nudge(id, by) { const j = await api("nudge", {id, by}); Object.assign(cueById(id), j.cue); renderReview(); toast(Math.abs(by) < 0.09 ? (by < 0 ? "Moved 1 frame earlier" : "Moved 1 frame later") : (by < 0 ? "Moved 0.1 s earlier" : "Moved 0.1 s later")); }
async function louder(id, db) { const j = await api("louder", {id, db}); Object.assign(cueById(id), j.cue); toast(db < 0 ? "A bit quieter" : "A bit louder"); }
async function remake(id) { const j = await api("remake", {id}); watchJob(j.job); }
function changeIt(id) {
  const c = cueById(id);
  modal(`<h2>How should “${esc(c.what)}” sound instead?</h2><div class="sub" style="margin:0">For example: a bigger splash, softer steps on grass, a happier horse call.</div>
    <input type="text" id="words" placeholder="Describe it in your own words" onkeydown="if(event.key==='Enter')doChange('${id}')">
    <div class="footerbar"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="doChange('${id}')">Make it</button></div>`);
  setTimeout(() => $("#words").focus(), 50);
}
async function doChange(id) { const words = $("#words").value.trim(); if (!words) return; closeModal(); toast("Asking " + aiName() + "…"); const j = await api("change", {id, words}); watchJob(j.job); }
async function copyWording(id) { const c = cueById(id); await navigator.clipboard.writeText(c.suno || c.adobe); toast(c.suno ? "Copied: paste it into Suno as the style" : "Copied: paste it into Adobe's sound effect generator"); }
async function makeMissing() { const j = await api("make_missing"); watchJob(j.job); }
async function finish() { const j = await api("finish"); watchJob(j.job); }

// ---------------------------------------------------------------- done
let DONE = null;
async function openFile(path, btn, msg) {
  const old = btn.innerHTML; btn.disabled = true; btn.textContent = msg || "Opening…";
  try { await api("open", {path}); }
  catch (e) {}
  finally { setTimeout(() => { btn.disabled = false; btn.innerHTML = old; }, 1500); }
}
async function runAgain(editLyrics) {
  const o = DONE; if (!o || !o.source) return;
  toast("Taking a fresh copy of your project…");
  const j = await api("open_project", {path: o.source, seq_uid: o.seq_uid});
  P = j.project;
  if (o.mode === "karaoke") {
    H.lyrics = o.lyrics || H.lyrics;
    if (editLyrics || !H.lyrics) { renderHome(); setupKaraoke(); return; }
    const k = await api("start_karaoke", {lyrics: H.lyrics}); watchJob(k.job); return;
  }
  renderHome();
  if (o.mode === "audio") setupFix(); else setupSounds();
}
async function renderDone() {
  const o = (await api("outputs")).outputs;
  DONE = o;
  setTimeout(() => chainNext(o), 50);
  const audioMode = o.mode === "audio", karaoke = o.mode === "karaoke";
  $("#view").innerHTML = `
    <div class="done">
      <div class="card">${o.preview ? `<video src="${o.preview}" controls></video>` : ""}</div>
      <div class="card">
        <div class="ok-ring">${ICON.check}</div>
        <h1>${karaoke ? "Your karaoke lyrics are ready!" : audioMode ? "Your audio is fixed!" : "Your movie has sound effects!"}</h1>
        <p class="sub">${o.project ? (karaoke ? "A copy of your Premiere project has the lyrics on their own video track at the top, over the whole song. Move it, fade it, or switch the track off any time." : audioMode ? "A copy of your Premiere project has cleaned, balanced audio." : "A copy of your Premiere project has every sound on its own tracks, in a bin called “StoryStudio sounds”.") + " Your original project wasn't changed." : esc(o.project_error)}</p>
        ${o.snapshot_time ? `<div class="sub" style="margin-top:-10px">Made from your project as it was at ${esc(o.snapshot_time)}.</div>` : ""}
        <div class="row" style="flex-wrap:wrap;gap:10px">
          ${o.project ? `<button class="btn primary big" onclick='openFile(${esc(JSON.stringify(o.project))}, this, "Opening in Premiere…")'>Open in Premiere</button>` : ""}
          <button class="btn" onclick='openFile(${esc(JSON.stringify(o.folder))}, this)'>${ICON.folder} Open the folder</button>
          ${o.list ? `<button class="btn" onclick='openFile(${esc(JSON.stringify(o.list))}, this)'>${karaoke ? "Lyrics timing" : audioMode ? "Notes" : "Sound list"}</button>` : ""}
        </div>
        ${o.source ? `<div class="row" style="flex-wrap:wrap;gap:10px;margin-top:14px">
          <button class="btn" onclick="runAgain()">↻ Run it again</button>
          ${karaoke ? `<button class="btn ghost" onclick="runAgain(true)">Change the lyrics…</button>` : ""}
          <span class="sub" style="margin:0">Uses your project as it is now${karaoke ? ", with the same lyrics" : ""}.</span></div>` : ""}
        ${o.levels && o.levels.length ? `<ul class="notes">${o.levels.slice(0,6).map(l => `<li>${esc(l)}</li>`).join("")}</ul>` : ""}
        <div class="footerbar">${audioMode || karaoke ? "<span></span>" : `<button class="btn ghost" onclick="api('review').then(j=>{R=j.review;renderReview()})">Back to the sounds</button>`}<button class="btn ghost" onclick="goHome()">Home</button></div>
      </div>
    </div>`;
}

// ---------------------------------------------------------------- settings
function aiName() { return (H.ai && H.ai.name) || "Claude"; }
async function openSettings() {
  modal(`<h2>Settings</h2>
    <div id="aibox" class="card" style="padding:16px;margin-bottom:18px"><b>Your AI helper</b><div class="sub" style="margin:6px 0 0">Checking for Claude and ChatGPT…</div></div>
    <p class="sub">Keys are kept on this computer only.</p>
    <label>Fal key, for better sound effects ${H.has_fal_key ? '<span class="chip good">saved</span>' : ""}</label>
    <input type="password" id="falk" autocomplete="off" placeholder="${H.has_fal_key ? "Leave empty to keep the saved key" : "Paste your Fal key"}" oninput="saveFalKey()" onchange="saveFalKey(true)">
    <div class="sub" style="margin-top:-8px;margin-bottom:16px">With this, sound effects are made by Fal instead of the sound AI on this PC: clearer, and made by watching each clip so they land in step with the picture. Fal charges your own Fal account, a few dollars for a story with lots of sounds. To get a key: sign in at fal.ai, open Keys, press “Add key” and copy it.</div>
    <label>Hugging Face key, for Stable Audio Open backgrounds ${H.has_hf_key ? '<span class="chip good">saved</span>' : ""}</label>
    <input type="text" id="hfk" placeholder="${H.has_hf_key ? "Leave empty to keep the saved key" : "Paste your key"}">
    <div class="sub" style="margin-top:-8px">How to get one: make a free account at huggingface.co, open <a href="https://huggingface.co/stabilityai/stable-audio-open-1.0" target="_blank">stable-audio-open-1.0</a> and click “Agree and access repository”, then create a “Read” token at huggingface.co/settings/tokens and paste it here.</div>
    <label style="display:block;margin-top:16px">Freesound key (optional) ${H.has_fs_key ? '<span class="chip good">saved</span>' : ""}</label>
    <input type="text" id="fsk" placeholder="${H.has_fs_key ? "Leave empty to keep the saved key" : "Paste your key"}">
    <div class="card" style="padding:16px;margin-top:18px"><b>Something went wrong?</b>
      <div class="sub" style="margin:6px 0 10px">This puts one file on your Desktop with the details of what happened on this computer (no keys or passwords). Send that file to whoever helps you with StoryStudio.</div>
      <button class="btn" id="prbtn" onclick="problemReport()">Save a problem report</button></div>
    <div class="footerbar"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveKeys()">Save</button></div>`);
  try { drawAi((await api("ai_status")).ai); } catch (e) {}
}
let aiOther = {};                     // "Another model…" picked: show the box to type it in
function modelPick(which, list, current, firstLabel) {
  list = (list || []).filter(m => m.id);
  const known = !current || list.some(m => m.id === current), other = aiOther[which] || !known;
  const note = other ? "Type the model's name exactly as " + (which === "claude" ? "Claude" : "ChatGPT") + " writes it." : ((list.find(m => m.id === current) || {}).note || (!current && which === "claude" ? "StoryStudio's usual choice: strong and quick." : !current ? "Whatever your ChatGPT account uses by default." : ""));
  return `<div class="field" style="margin-left:18px;flex-wrap:wrap">Model <select onchange="aiPick('${which}', this.value)">
      <option value="" ${!current && !other ? "selected" : ""}>${esc(firstLabel)}</option>
      ${list.map(m => `<option value="${esc(m.id)}" ${!other && m.id === current ? "selected" : ""}>${esc(m.name)}</option>`).join("")}
      <option value="__other" ${other ? "selected" : ""}>Another model…</option></select>
    ${other ? `<input type="text" style="width:220px;margin:0" value="${esc(known ? "" : current)}" placeholder="${which === "claude" ? "claude-opus-5-5" : "gpt-6.1-sol"}" onchange="aiModel('${which}', this.value)">` : ""}
    ${note ? `<span class="sub" style="margin:0;flex-basis:100%">${esc(note)}</span>` : ""}</div>`;
}
function aiPick(which, v) { if (v === "__other") { aiOther[which] = true; drawAi(H.ai); } else { aiOther[which] = false; aiModel(which, v); } }
async function aiModel(which, model) {
  const j = await api("ai_model", {which, model: String(model || "").trim()});
  aiOther[which] = false;              // a typed name that is on the list shows as that entry
  drawAi(Object.assign({}, H.ai, j.ai)); toast("Saved. StoryStudio uses it from now on.");
}
function drawAi(ai) {
  const box = $("#aibox"); if (!box) return;
  H.ai = Object.assign(H.ai || {}, ai);
  const gpt = ai.chatgpt === "ready" ? '<span class="chip good">Ready</span>'
    : ai.chatgpt === "signed_out" ? '<span class="chip warn">Not signed in</span> <button class="btn" onclick="aiSignIn()">Sign in to ChatGPT</button>'
    : '<span class="chip">Not set up</span> <button class="btn" onclick="aiInstall()">Set up ChatGPT</button>';
  const choice = (v, t) => `<button class="${ai.choice===v?"on":""}" onclick="aiChoose('${v}')">${t}</button>`;
  box.innerHTML = `<b>Your AI helper</b>
    <div class="sub" style="margin:4px 0 12px">Plans sounds and gives edit feedback. StoryStudio works with Claude or ChatGPT, using your own plan (no extra cost).</div>
    <div class="field" style="margin-top:0">Claude ${ai.claude ? '<span class="chip good">On this computer</span>' : '<span class="chip">Not installed</span>'}</div>
    ${ai.claude ? modelPick("claude", ai.claude_models, ai.claude_model, "Opus, always the newest") : ""}
    <div class="field">ChatGPT ${gpt}</div>
    ${ai.chatgpt === "ready" ? modelPick("chatgpt", ai.chatgpt_models, ai.chatgpt_model, "Your ChatGPT default") : ""}
    <div class="field">Use <div class="seg">${choice("auto","Automatic")}${choice("claude","Claude")}${choice("chatgpt","ChatGPT")}</div></div>
    <div class="sub" style="margin:10px 0 0">${ai.name ? `Right now StoryStudio is using <b>${ai.name}</b>${ai.model_name ? ` (${esc(ai.model_name)})` : ""}.` : "Neither is set up yet: set up ChatGPT above, or install Claude."}</div>`;
}
async function aiChoose(v) { const j = await api("ai_choose", {choice:v}); drawAi(Object.assign({}, H.ai, j.ai)); }
async function aiSignIn() { await api("ai_sign_in_chatgpt"); toast("A sign-in window opened. Sign in there, then come back here.", false); setTimeout(async () => drawAi((await api("ai_status")).ai), 20000); }
async function aiInstall() { closeModal(); const j = await api("ai_install_chatgpt"); watchJob(j.job); }
// the Fal key is saved the moment it is pasted (no need to find the Save button)
let falTimer = null;
function saveFalKey(now) {
  clearTimeout(falTimer);
  falTimer = setTimeout(async () => {
    const box = $("#falk"); if (!box) return;
    const fal = box.value.trim(); if (fal.length < 8) return;
    await api("save_settings", {fal_key: fal});
    H.has_fal_key = true; box.value = ""; box.placeholder = "Saved. Paste a different key to replace it";
    const lab = box.previousElementSibling; if (lab && !lab.querySelector(".chip")) lab.insertAdjacentHTML("beforeend", '<span class="chip good">saved</span>');
    toast("Your Fal key is saved. Sound effects will be made by Fal.");
  }, now ? 0 : 900);
}
async function saveKeys() {
  const hf = $("#hfk").value.trim(), fs = $("#fsk").value.trim(), fal = $("#falk").value.trim();
  await api("save_settings", {hf_key:hf, freesound_key:fs, fal_key:fal, use_freesound: fs ? true : undefined});
  closeModal(); toast("Saved"); H = await api("hello");
}

// ---------------------------------------------------------------- updates
let UPD = null;
async function checkUpdate() {
  try { const j = await api("update_check"); UPD = j.update; } catch (e) { return; }
  const bar = $("#updbar");
  if (!UPD) { bar.classList.add("hidden"); return; }
  bar.innerHTML = `<span>✨ A new version of StoryStudio (${esc(UPD.version)}) is ready.${UPD.notes ? " " + esc(UPD.notes) : ""}</span><button class="btn small primary" onclick="updateNow()">Update now</button><button class="btn small ghost" onclick="$('#updbar').classList.add('hidden')">Later</button>`;
  bar.classList.remove("hidden");
}
async function updateNow() {
  const bar = $("#updbar");
  bar.innerHTML = `<span><span class="spin"></span> Updating StoryStudio… it will reopen by itself in a few seconds.</span>`;
  let j;
  try { j = await api("update_now"); } catch (e) { checkUpdate(); return; }
  if (!j.ok) { bar.innerHTML = `<span>${esc(j.message || "You already have the newest version.")}</span>`; setTimeout(() => bar.classList.add("hidden"), 4000); return; }
  bar.innerHTML = `<span>✓ Updated to ${esc(j.version)}. StoryStudio is reopening…</span>`;
  setTimeout(() => { try { window.close(); } catch (e) {} }, 4000);
}
setTimeout(checkUpdate, 4000);
setInterval(checkUpdate, 30 * 60 * 1000);

goHome();
</script>
</body>
</html>
